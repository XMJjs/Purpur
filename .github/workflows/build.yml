name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Only one continuous-release build at a time: parallel runs would race
# on deleting/creating the same "continuous" release.
concurrency:
  group: continuous-release
  cancel-in-progress: true

jobs:
  build:
    name: Build Purpur (Java 25)
    runs-on: ubuntu-latest
    env:
      # settings.gradle.kts reads BUILD_NUMBER to produce the release version
      # string "26.1.2.build.<N>-stable". Without it the version becomes
      # "26.1.2.local-SNAPSHOT", whose "local" token breaks many plugins'
      # version parsers (Images, AuraSkills, HibiscusCommons, ...).
      # Use github.run_number so every CI build carries a real build number,
      # matching the version format of official Purpur builds.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Create Paperclip jar (runnable server launcher)
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Rebuild on failure (refresh dependencies)
        if: ${{ failure() }}
        run: |
          ./gradlew clean cleanCache --refresh-dependencies
          ./gradlew applyAllPatches --stacktrace
          ./gradlew build --stacktrace

      - name: Upload server artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: purpur-server
          path: |
            purpur-server/build/libs/*.jar
            purpur-server/build/libs/*paperclip*.jar
          if-no-files-found: error

      - name: Upload api artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: purpur-api
          path: purpur-api/build/libs/*.jar
          if-no-files-found: error

      - name: Publish runnable server to GitHub Releases
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Resolve version identifiers.
          # NOTE: gradle.properties uses "mcVersion = 26.1.2" (spaces around =),
          # so the grep pattern must tolerate whitespace and the value must be trimmed.
          MC_VERSION="$(grep -E '^mcVersion[[:space:]]*=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')"
          if [ -z "${MC_VERSION:-}" ]; then
            echo "::error::mcVersion not found in gradle.properties"
            exit 1
          fi
          SHA_SHORT="$(git rev-parse --short HEAD)"
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          # Locate the paperclip (runnable) jar produced by createPaperclipJar
          PAPERCLIP_JAR="$(ls purpur-server/build/libs/*paperclip*.jar 2>/dev/null | head -1 || true)"
          if [ -z "${PAPERCLIP_JAR:-}" ]; then
            # Fallback: use the dev bundle if the paperclip jar is not produced
            PAPERCLIP_JAR="$(ls purpur-server/build/libs/purpur-server-*.jar 2>/dev/null | head -1 || true)"
          fi
          if [ -z "${PAPERCLIP_JAR:-}" ]; then
            echo "::error::No server jar found under purpur-server/build/libs/"
            exit 1
          fi
          # Give the artifact a stable, descriptive name
          RELEASE_JAR="purpur-${MC_VERSION}-${SHA_SHORT}-server.jar"
          cp "${PAPERCLIP_JAR}" "${RELEASE_JAR}"
          # Replace the previous continuous release (same tag) so every push updates one release
          if ! gh release delete continuous --yes --cleanup-tag 2>/dev/null; then
            echo "::warning::No previous 'continuous' release to delete (first run?)"
          fi
          NOTES=$(printf '%s\n' \
            "**自动构建服务端** — 可直接运行（需要 JDK 25）" \
            "- MC 版本：${MC_VERSION}" \
            "- 构建提交：\`${SHA_SHORT}\` — ${COMMIT_MSG}" \
            "- 构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')" \
            "- 产物：\`${RELEASE_JAR}\`（paperclip 启动器，含全部依赖）" \
            "" \
            "**使用方法**：" \
            "\`\`\`bash" \
            "java -jar ${RELEASE_JAR}" \
            "\`\`\`" \
            "首次启动会在线校验/解压 libraries（需网络）。本 Release 为 Continuous（预发布）版，每次推送到 main 自动更新；正式版本请打 \`v*\` tag 发布。")
          if ! gh release create "continuous" "${RELEASE_JAR}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Purpur ${MC_VERSION} Continuous Build (${SHA_SHORT})" \
            --notes "${NOTES}" \
            --prerelease; then
            echo "::error::gh release create failed. If the tag 'continuous' already exists, run a fresh push to clean it up."
            exit 1
          fi
          echo "::notice::Published ${RELEASE_JAR} to GitHub Releases (tag: continuous)"
