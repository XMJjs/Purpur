name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Purpur (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Create Paperclip jar (runnable server launcher)
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Rebuild on failure (refresh dependencies)
        if: ${{ failure() }}
        run: |
          ./gradlew clean cleanCache --refresh-dependencies
          ./gradlew applyAllPatches --stacktrace
          ./gradlew build --stacktrace

      - name: Upload server artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: purpur-server
          path: |
            purpur-server/build/libs/*.jar
            purpur-server/build/libs/*paperclip*.jar
          if-no-files-found: error

      - name: Upload api artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: purpur-api
          path: purpur-api/build/libs/*.jar
          if-no-files-found: error
